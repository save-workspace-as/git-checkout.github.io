name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The extension repository can ask for a new build when it releases, so the changelog and the docs follow.
  repository_dispatch:
    types: [extension-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: save-workspace-as/git-checkout
          path: extension
      - uses: withastro/action@v3
        env:
          # The docs, the changelog and the screenshots come from the extension repository.
          EXTENSION_PATH: extension
          # Set these repository variables for a custom domain; the base is `/` there.
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
